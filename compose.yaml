name: payments-lab

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab_local
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

  rabbitmq-test:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq-test
    profiles: ['test']
    environment:
      RABBITMQ_DEFAULT_USER: lab_test
      RABBITMQ_DEFAULT_PASS: lab_test_local
    ports:
      - '127.0.0.1:5673:5672'
      - '127.0.0.1:15673:15672'
    volumes:
      - rabbitmq-test-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 30

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_only
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./infra/postgres/init-orders.sql:/docker-entrypoint-initdb.d/01-orders.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  orders-test-db:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: orders_test
      POSTGRES_PASSWORD: orders_test_local
      POSTGRES_DB: orders_test
    ports:
      - '127.0.0.1:15433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders_test -d orders_test']
      interval: 2s
      timeout: 3s
      retries: 30

  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_payments_admin_only
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:15434:5432'
    volumes:
      - payments-data:/var/lib/postgresql/data
      - ./infra/postgres/init-payments.sql:/docker-entrypoint-initdb.d/01-payments.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  payments-test-db:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: payments_test
      POSTGRES_PASSWORD: payments_test_local
      POSTGRES_DB: payments_test
    ports:
      - '127.0.0.1:15435:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments_test -d payments_test']
      interval: 2s
      timeout: 3s
      retries: 30

  provider-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_provider_admin_only
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:15436:5432'
    volumes:
      - provider-data:/var/lib/postgresql/data
      - ./infra/postgres/init-provider.sql:/docker-entrypoint-initdb.d/01-provider.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  provider-test-db:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: provider_test
      POSTGRES_PASSWORD: provider_test_local
      POSTGRES_DB: provider_test
    ports:
      - '127.0.0.1:15437:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U provider_test -d provider_test']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  rabbitmq-data:
  rabbitmq-test-data:
  orders-data:
  payments-data:
  provider-data:
